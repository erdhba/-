<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 인간 디자인 & 오픈월드 시뮬레이터</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #87CEEB; }
        #canvas-container { width: 100%; height: 100%; display: block; }
        
        /* UI 스타일 */
        #customizer-ui {
            position: absolute; top: 20px; left: 20px; width: 340px; max-height: calc(100vh - 40px);
            background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px);
            border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-y: auto; z-index: 10; transition: all 0.3s ease;
        }
        #customizer-ui h2 { margin-bottom: 15px; color: #333; font-size: 1.4rem; text-align: center; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .section-title { font-weight: bold; margin: 12px 0 6px; color: #555; font-size: 0.95rem; }
        .control-group { margin-bottom: 10px; }
        .control-group label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 4px; }
        select, input[type="color"], input[type="range"] { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; outline: none; background: #fff; }
        input[type="range"] { -webkit-appearance: none; height: 6px; background: #ddd; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #4A90E2; cursor: pointer; }
        
        #btn-start {
            width: 100%; padding: 12px; margin-top: 15px; background: #4CAF50; color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3); transition: transform 0.1s, background 0.2s;
        }
        #btn-start:hover { background: #45a049; transform: translateY(-2px); }

        /* 조작 가이드 & HUD */
        #hud {
            position: absolute; bottom: 20px; left: 20px; color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8); pointer-events: none; font-size: 0.9rem; z-index: 5;
            background: rgba(0, 0, 0, 0.4); padding: 15px; border-radius: 10px; backdrop-filter: blur(5px);
        }
        #interaction-prompt {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #FFF; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px;
            font-size: 1.1rem; font-weight: bold; display: none; pointer-events: none; z-index: 5;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: white;
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; display: none;
        }
    </style>
    <!-- Three.js 및 관련 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 캐릭터 커스터마이징 UI -->
    <div id="customizer-ui">
        <h2>🎨 캐릭터 디자인</h2>
        
        <div class="section-title">신체 설정</div>
        <div class="control-group">
            <label>성별</label>
            <select id="gender"><option value="male">남성</option><option value="female">여성</option></select>
        </div>
        <div class="control-group">
            <label>피부색</label>
            <input type="color" id="skinColor" value="#ffdbac">
        </div>
        <div class="control-group">
            <label>체격 (어깨/골반)</label>
            <input type="range" id="build" min="0.8" max="1.3" step="0.05" value="1.0">
        </div>
        <div class="control-group">
            <label>비만도 (체중)</label>
            <input type="range" id="fatness" min="0.8" max="1.5" step="0.05" value="1.0">
        </div>

        <div class="section-title">머리 & 얼굴</div>
        <div class="control-group">
            <label>머리 스타일</label>
            <select id="hairStyle">
                <option value="short">숏컷</option>
                <option value="long">롱헤어</option>
                <option value="afro">아프로</option>
                <option value="none">민머리</option>
            </select>
        </div>
        <div class="control-group">
            <label>머리 색상</label>
            <input type="color" id="hairColor" value="#2c1608">
        </div>
        <div class="control-group">
            <label>모자</label>
            <select id="hatStyle">
                <option value="none">없음</option>
                <option value="beanie">비니</option>
                <option value="cap">캡 모자</option>
            </select>
        </div>

        <div class="section-title">의상 & 장신구</div>
        <div class="control-group">
            <label>상의 종류</label>
            <select id="topStyle">
                <option value="short">반팔</option>
                <option value="long">긴팔</option>
                <option value="hoodie">후드</option>
                <option value="zipup">후드집업</option>
                <option value="padding">패딩</option>
                <option value="lightPadding">경량 패딩</option>
                <option value="longPadding">롱 패딩</option>
            </select>
        </div>
        <div class="control-group">
            <label>상의 색상</label>
            <input type="color" id="topColor" value="#3498db">
        </div>
        <div class="control-group">
            <label>하의 종류</label>
            <select id="bottomStyle">
                <option value="denim">데님 팬츠</option>
                <option value="sweat">스웻 팬츠</option>
                <option value="bermuda">버뮤다 팬츠</option>
                <option value="shorts">반바지</option>
            </select>
        </div>
        <div class="control-group">
            <label>하의 색상</label>
            <input type="color" id="bottomColor" value="#2c3e50">
        </div>
        <div class="control-group">
            <label>장신구</label>
            <select id="accessory">
                <option value="none">없음</option>
                <option value="glasses">안경</option>
                <option value="mask">마스크</option>
            </select>
        </div>

        <button id="btn-start">시티 입장하기 🚀</button>
    </div>

    <!-- HUD 안내 -->
    <div id="hud">
        <b>[ 조작법 안내 ]</b><br>
        • 이동: <b>WASD</b> | 토글 달리기/걷기: <b>Shift</b> | 점프: <b>Space</b><br>
        • 시점 변경: <b>1</b> (1인칭) / <b>3</b> (3인칭)<br>
        • 공격: <b>마우스 우클릭</b>(잽), <b>좌클릭</b>(스트레이트), <b>좌클릭 더블</b>(라이트 훅), <b>우클릭 더블</b>(레프트 바디)<br>
        • 상호작용: <b>F</b> (문 열기/닫기), <b>Q</b> (앉기/눕기)<br>
        • 차량 탑승/하차: 차 옆에서 <b>X</b> (운전: WASD, 브레이크: <b>4</b>, 헤드라이트: <b>5</b>)
    </div>

    <div id="interaction-prompt">F키를 눌러 문 열기</div>
    <div id="crosshair"></div>

    <script>
        // --- 1. 기본 씬 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Skyblue
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // 조명 (아침 햇살)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        sunLight.position.set(100, 150, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 500;
        const d = 100;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // --- 2. 구름 생성 ---
        function createClouds() {
            const cloudGroup = new THREE.Group();
            const geo = new THREE.DodecahedronGeometry(5, 1);
            const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true, transparent: true, opacity: 0.85 });
            for(let i=0; i<30; i++) {
                const cloud = new THREE.Group();
                const nPuffs = 3 + Math.floor(Math.random()*4);
                for(let j=0; j<nPuffs; j++) {
                    const p = new THREE.Mesh(geo, mat);
                    p.position.set(j*3, Math.random()*2, Math.random()*2);
                    p.scale.setScalar(1 + Math.random()*0.5);
                    cloud.add(p);
                }
                cloud.position.set((Math.random()-0.5)*400, 40 + Math.random()*20, (Math.random()-0.5)*400);
                cloudGroup.add(cloud);
            }
            scene.add(cloudGroup);
        }
        createClouds();

        // --- 3. 캐릭터 절차적 3D 모델 생성 ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // 신체 파트 메시 참조
        let bodyParts = {
            head: null, hair: null, hat: null, torso: null,
            armL: null, armR: null, legL: null, legR: null, accessory: null
        };
        let playerMaterials = {
            skin: new THREE.MeshStandardMaterial({ roughness: 0.6 }),
            hair: new THREE.MeshStandardMaterial({ roughness: 0.8 }),
            top: new THREE.MeshStandardMaterial({ roughness: 0.5 }),
            bottom: new THREE.MeshStandardMaterial({ roughness: 0.7 }),
            hat: new THREE.MeshStandardMaterial({ color: 0x222222 }),
            acc: new THREE.MeshStandardMaterial({ color: 0x111111, metallic: 0.8 })
        };

        function buildCharacter() {
            // 기존 파트 제거
            while(playerGroup.children.length > 0) playerGroup.remove(playerGroup.children[0]);

            const fat = parseFloat(document.getElementById('fatness').value);
            const build = parseFloat(document.getElementById('build').value);
            const isFemale = document.getElementById('gender').value === 'female';

            // 골격 루틴 생성
            const waistWidth = 0.5 * fat;
            const shoulderWidth = (isFemale ? 0.6 : 0.8) * build * fat;

            // 몸통 (Torso)
            const topStyle = document.getElementById('topStyle').value;
            let torsoHeight = 0.7;
            if(topStyle === 'longPadding') torsoHeight = 1.1;

            const torsoGeo = new THREE.BoxGeometry(shoulderWidth, torsoHeight, 0.3 * fat);
            bodyParts.torso = new THREE.Mesh(torsoGeo, playerMaterials.top);
            bodyParts.torso.position.y = 1.0;
            bodyParts.torso.castShadow = true;
            playerGroup.add(bodyParts.torso);

            // 머리 (Head)
            const headGeo = new THREE.SphereGeometry(0.2, 16, 16);
            bodyParts.head = new THREE.Mesh(headGeo, playerMaterials.skin);
            bodyParts.head.position.y = torsoHeight/2 + 0.25;
            bodyParts.torso.add(bodyParts.head);

            // 머리 스타일
            const hairStyle = document.getElementById('hairStyle').value;
            if(hairStyle !== 'none') {
                let hGeo;
                if(hairStyle === 'short') hGeo = new THREE.BoxGeometry(0.42, 0.15, 0.42);
                else if(hairStyle === 'long') hGeo = new THREE.BoxGeometry(0.44, 0.5, 0.44);
                else if(hairStyle === 'afro') hGeo = new THREE.SphereGeometry(0.28, 8, 8);
                bodyParts.hair = new THREE.Mesh(hGeo, playerMaterials.hair);
                bodyParts.hair.position.set(0, 0.1, (hairStyle==='long'?-0.05:0));
                bodyParts.head.add(bodyParts.hair);
            }

            // 모자 (Hat)
            const hatStyle = document.getElementById('hatStyle').value;
            if(hatStyle === 'beanie') {
                const bGeo = new THREE.CylinderGeometry(0.22, 0.23, 0.2, 16);
                bodyParts.hat = new THREE.Mesh(bGeo, playerMaterials.hat);
                bodyParts.hat.position.y = 0.15;
                bodyParts.head.add(bodyParts.hat);
            } else if(hatStyle === 'cap') {
                const cGeo = new THREE.Group();
                const top = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 8, 0, Math.PI*2, 0, Math.PI/2), playerMaterials.hat);
                const visor = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.02, 0.2), playerMaterials.hat);
                visor.position.set(0, 0, 0.2);
                cGeo.add(top, visor);
                cGeo.position.y = 0.1;
                bodyParts.hat = cGeo;
                bodyParts.head.add(cGeo);
            }

            // 장신구
            const accStyle = document.getElementById('accessory').value;
            if(accStyle === 'glasses') {
                const gGeo = new THREE.BoxGeometry(0.35, 0.08, 0.05);
                bodyParts.accessory = new THREE.Mesh(gGeo, playerMaterials.acc);
                bodyParts.accessory.position.set(0, 0, 0.18);
                bodyParts.head.add(bodyParts.accessory);
            }

            // 팔 (Arms)
            const armLen = 0.6;
            const armGeo = new THREE.BoxGeometry(0.12 * fat, armLen, 0.12 * fat);
            
            // 왼팔
            bodyParts.armL = new THREE.Group();
            const armLMesh = new THREE.Mesh(armGeo, (topStyle==='short'? playerMaterials.skin : playerMaterials.top));
            armLMesh.position.y = -armLen/2;
            armLMesh.castShadow = true;
            bodyParts.armL.add(armLMesh);
            bodyParts.armL.position.set(shoulderWidth/2 + 0.08, torsoHeight/2 - 0.1, 0);
            bodyParts.torso.add(bodyParts.armL);

            // 오른팔
            bodyParts.armR = new THREE.Group();
            const armRMesh = new THREE.Mesh(armGeo, (topStyle==='short'? playerMaterials.skin : playerMaterials.top));
            armRMesh.position.y = -armLen/2;
            armRMesh.castShadow = true;
            bodyParts.armR.add(armRMesh);
            bodyParts.armR.position.set(-(shoulderWidth/2 + 0.08), torsoHeight/2 - 0.1, 0);
            bodyParts.torso.add(bodyParts.armR);

            // 다리 (Legs)
            const bottomStyle = document.getElementById('bottomStyle').value;
            const legLen = 0.7;
            const legGeo = new THREE.BoxGeometry(0.16 * fat, legLen, 0.16 * fat);

            bodyParts.legL = new THREE.Group();
            const legLMesh = new THREE.Mesh(legGeo, (bottomStyle==='shorts'||bottomStyle==='bermuda'? playerMaterials.skin : playerMaterials.bottom));
            legLMesh.position.y = -legLen/2;
            legLMesh.castShadow = true;
            bodyParts.legL.add(legLMesh);
            bodyParts.legL.position.set(waistWidth/4, -torsoHeight/2, 0);
            bodyParts.torso.add(bodyParts.legL);

            bodyParts.legR = new THREE.Group();
            const legRMesh = new THREE.Mesh(legGeo, (bottomStyle==='shorts'||bottomStyle==='bermuda'? playerMaterials.skin : playerMaterials.bottom));
            legRMesh.position.y = -legLen/2;
            legRMesh.castShadow = true;
            bodyParts.legR.add(legRMesh);
            bodyParts.legR.position.set(-waistWidth/4, -torsoHeight/2, 0);
            bodyParts.torso.add(bodyParts.legR);
        }

        // 커스텀 UI 이벤트 리스너
        function updateMaterials() {
            playerMaterials.skin.color.set(document.getElementById('skinColor').value);
            playerMaterials.hair.color.set(document.getElementById('hairColor').value);
            playerMaterials.top.color.set(document.getElementById('topColor').value);
            playerMaterials.bottom.color.set(document.getElementById('bottomColor').value);
        }

        document.querySelectorAll('#customizer-ui input, #customizer-ui select').forEach(elem => {
            elem.addEventListener('input', () => {
                updateMaterials();
                buildCharacter();
            });
        });

        updateMaterials();
        buildCharacter();

        // --- 4. 맵 & 환경 생성 (도로, 공원, 건물, 법원, 집, 차고 등) ---
        const interactables = []; // F키 상호작용 가능한 문 등
        const sitables = []; // Q키 상호작용 가능한 의자/침대
        const vehicles = [];

        function buildWorld() {
            // 바닥 (도로 & 인도 & 잔디)
            const groundGroup = new THREE.Group();

            // 메인 잔디밭 Base
            const grassGeo = new THREE.PlaneGeometry(500, 500);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x557a2b, roughness: 0.9 });
            const mainGrass = new THREE.Mesh(grassGeo, grassMat);
            mainGrass.rotation.x = -Math.PI / 2;
            mainGrass.receiveShadow = true;
            groundGroup.add(mainGrass);

            // 도로망 (아스팔트)
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.5 });

            // 십자로 & 인도
            const road1 = new THREE.Mesh(new THREE.PlaneGeometry(20, 400), roadMat);
            road1.rotation.x = -Math.PI / 2; road1.position.y = 0.01; road1.receiveShadow = true;
            const road2 = new THREE.Mesh(new THREE.PlaneGeometry(400, 20), roadMat);
            road2.rotation.x = -Math.PI / 2; road2.position.y = 0.01; road2.receiveShadow = true;
            groundGroup.add(road1, road2);

            // 인도 (Sidewalk)
            const sw1 = new THREE.Mesh(new THREE.PlaneGeometry(24, 400), sidewalkMat);
            sw1.rotation.x = -Math.PI / 2; sw1.position.y = 0.005; sw1.receiveShadow = true;
            const sw2 = new THREE.Mesh(new THREE.PlaneGeometry(400, 24), sidewalkMat);
            sw2.rotation.x = -Math.PI / 2; sw2.position.y = 0.005; sw2.receiveShadow = true;
            groundGroup.add(sw1, sw2);

            scene.add(groundGroup);

            // --- 공원 & 호수 & 숲 ---
            const parkGroup = new THREE.Group();
            parkGroup.position.set(50, 0, 50);

            // 호수
            const lakeMat = new THREE.MeshStandardMaterial({ color: 0x2389da, roughness: 0.1, metalness: 0.8 });
            const lake = new THREE.Mesh(new THREE.CircleGeometry(25, 32), lakeMat);
            lake.rotation.x = -Math.PI / 2; lake.position.y = 0.02;
            parkGroup.add(lake);

            // 나무 (숲)
            const treeTrunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 3);
            const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28 });
            const treeLeavesGeo = new THREE.ConeGeometry(2, 5, 8);
            const treeLeavesMat = new THREE.MeshStandardMaterial({ color: 0x2e6f40, flatShading: true });

            for(let i=0; i<40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 30 + Math.random() * 35;
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(treeTrunkGeo, treeTrunkMat);
                trunk.position.y = 1.5; trunk.castShadow = true;
                const leaves = new THREE.Mesh(treeLeavesGeo, treeLeavesMat);
                leaves.position.y = 4; leaves.castShadow = true;
                tree.add(trunk, leaves);
                tree.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
                parkGroup.add(tree);
            }

            // 벤치 (Q키 상호작용)
            const benchMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            for(let b=0; b<4; b++) {
                const bench = new THREE.Group();
                const seat = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 0.6), benchMat);
                seat.position.y = 0.5; seat.castShadow = true;
                const back = new THREE.Mesh(new THREE.BoxGeometry(2, 0.6, 0.1), benchMat);
                back.position.set(0, 0.8, -0.25); back.castShadow = true;
                bench.add(seat, back);
                const angle = (b / 4) * Math.PI * 2;
                bench.position.set(Math.cos(angle)*18, 0, Math.sin(angle)*18);
                bench.rotation.y = -angle + Math.PI/2;
                parkGroup.add(bench);
                sitables.push({ obj: bench, type: 'chair', text: '벤치에 앉기 (Q)' });
            }

            scene.add(parkGroup);

            // --- 일반 건물 & 법원 (Court) ---
            buildCityBuildings();

            // --- 플레이어 2층 집 & 마당 & 강아지 ---
            buildPlayerHouse();
        }

        // 도시 건물들 생성
        function buildCityBuildings() {
            // 법원 (Courthouse)
            const court = new THREE.Group();
            court.position.set(-60, 0, 50);

            const mainCourtMat = new THREE.MeshStandardMaterial({ color: 0xe0dacf, roughness: 0.3 });
            const base = new THREE.Mesh(new THREE.BoxGeometry(30, 12, 20), mainCourtMat);
            base.position.y = 6; base.castShadow = true; base.receiveShadow = true;
            court.add(base);

            // 법원 기둥들
            const colMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            for(let i = -12; i <= 12; i += 4) {
                const col = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 10), colMat);
                col.position.set(i, 5, 10.5); col.castShadow = true;
                court.add(col);
            }
            // 상단 삼각형 지붕
            const roofGeo = new THREE.ConeGeometry(18, 5, 4);
            const roof = new THREE.Mesh(roofGeo, mainCourtMat);
            roof.position.set(0, 14.5, 5); roof.rotation.y = Math.PI / 4;
            court.add(roof);

            scene.add(court);

            // 주변 빌딩 4개 (스카이라인)
            const bldgColors = [0x7f8c8d, 0x95a5a6, 0x34495e, 0xbdc3c7];
            const positions = [[-60, -60], [60, -60], [-100, 0], [100, -60]];

            positions.forEach((pos, idx) => {
                const bldg = new THREE.Group();
                bldg.position.set(pos[0], 0, pos[1]);
                const h = 25 + idx * 10;
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(20, h, 20), new THREE.MeshStandardMaterial({ color: bldgColors[idx] }));
                mesh.position.y = h/2; mesh.castShadow = true; mesh.receiveShadow = true;
                bldg.add(mesh);

                // 상호작용 가능한 법원/빌딩 문
                const door = new THREE.Mesh(new THREE.BoxGeometry(3, 5, 0.2), new THREE.MeshStandardMaterial({ color: 0x222222 }));
                door.position.set(0, 2.5, 10.1);
                bldg.add(door);
                interactables.push({ obj: door, open: false, type: 'door', text: '건물 문 열기/닫기 (F)' });

                scene.add(bldg);
            });
        }

        // 플레이어의 세련된 2층 집 및 차고
        function buildPlayerHouse() {
            const houseGroup = new THREE.Group();
            houseGroup.position.set(-50, 0, -50);

            // 마당 잔디
            const yard = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x477023 }));
            yard.rotation.x = -Math.PI / 2; yard.position.y = 0.01; yard.receiveShadow = true;
            houseGroup.add(yard);

            // 2층 집 본체 (투명/내부 접근 가능 형태의 오픈 벽면)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.2 });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.4 }); // 원목 느낌

            // 1층 바닥
            const floor1 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.2, 16), floorMat);
            floor1.position.set(0, 0.1, 0); floor1.receiveShadow = true;
            houseGroup.add(floor1);

            // 2층 바닥
            const floor2 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.2, 10), floorMat);
            floor2.position.set(0, 4.1, -3); floor2.receiveShadow = true;
            houseGroup.add(floor2);

            // 벽체 일부
            const backWall = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 0.4), wallMat);
            backWall.position.set(0, 4, -8); backWall.castShadow = true;
            houseGroup.add(backWall);

            // 문 (Interactive F key)
            const houseDoorPivot = new THREE.Group();
            houseDoorPivot.position.set(0, 0, 8);
            const houseDoor = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 0.2), new THREE.MeshStandardMaterial({ color: 0x3d2314 }));
            houseDoor.position.set(1.5, 2, 0); houseDoor.castShadow = true;
            houseDoorPivot.add(houseDoor);
            houseGroup.add(houseDoorPivot);
            interactables.push({ obj: houseDoorPivot, open: false, type: 'houseDoor', text: '우리집 문 열기/닫기 (F)' });

            // --- 집 내부 가구 (세련된 인테리어) ---
            // 1층 소파 (Q키 상호작용)
            const sofa = new THREE.Group();
            const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(5, 0.8, 2), new THREE.MeshStandardMaterial({ color: 0x333333 }));
            sofaBase.position.y = 0.4; sofaBase.castShadow = true;
            sofa.add(sofaBase);
            sofa.position.set(-4, 0.1, 2);
            houseGroup.add(sofa);
            sitables.push({ obj: sofa, type: 'sofa', text: '소파에 앉기 (Q)' });

            // 2층 침대 (Q키 상호작용)
            const bed = new THREE.Group();
            const bedFrame = new THREE.Mesh(new THREE.BoxGeometry(4, 0.6, 5), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            bedFrame.position.y = 0.3;
            const pillow = new THREE.Mesh(new THREE.BoxGeometry(3, 0.3, 1), new THREE.MeshStandardMaterial({ color: 0x3498db }));
            pillow.position.set(0, 0.75, -1.8);
            bed.add(bedFrame, pillow);
            bed.position.set(4, 4.2, -4);
            houseGroup.add(bed);
            sitables.push({ obj: bed, type: 'bed', text: '침대에 눕기 (Q)' });

            // --- 마당의 개 (Dog) ---
            const dog = new THREE.Group();
            const dogMat = new THREE.MeshStandardMaterial({ color: 0xc27c0e });
            const dogBody = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 1), dogMat);
            dogBody.position.y = 0.5; dogBody.castShadow = true;
            const dogHead = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), dogMat);
            dogHead.position.set(0, 0.9, 0.5); dogHead.castShadow = true;
            dog.add(dogBody, dogHead);
            dog.position.set(8, 0, 10);
            houseGroup.add(dog);

            scene.add(houseGroup);

            // --- 차고 & 5대의 색이 다른 차 생성 ---
            buildGarageAndCars();
        }

        // 차고 및 차 5대 생성
        function buildGarageAndCars() {
            const carColors = [0xe74c3c, 0x2ecc71, 0x3498db, 0xf1c40f, 0x9b59b6]; // 5가지 색상

            carColors.forEach((color, idx) => {
                const car = new THREE.Group();
                
                // 차체
                const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.5 });
                const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1, 4.5), bodyMat);
                body.position.y = 0.8; body.castShadow = true;
                car.add(body);

                // 지붕
                const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, transparent: true, opacity: 0.7 });
                const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 2.2), cabinMat);
                cabin.position.set(0, 1.6, -0.2);
                car.add(cabin);

                // 헤드라이트 (Light)
                const headlightL = new THREE.SpotLight(0xffffff, 0, 40, Math.PI/6);
                headlightL.position.set(0.8, 0.8, 2.2);
                headlightL.target.position.set(0.8, 0, 10);
                const headlightR = headlightL.clone();
                headlightR.position.x = -0.8;
                headlightR.target.position.set(-0.8, 0, 10);
                car.add(headlightL, headlightR, headlightL.target, headlightR.target);

                // 바퀴 4개
                const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
                const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
                wheelGeo.rotateZ(Math.PI / 2);

                const wPos = [[1.1, 0.4, 1.3], [-1.1, 0.4, 1.3], [1.1, 0.4, -1.3], [-1.1, 0.4, -1.3]];
                wPos.forEach(p => {
                    const w = new THREE.Mesh(wheelGeo, wheelMat);
                    w.position.set(...p); w.castShadow = true;
                    car.add(w);
                });

                // 배치 위치 (차고 옆 정렬)
                car.position.set(-20 + (idx * 4), 0, -65);
                scene.add(car);

                // 차량 제어 객체 저장
                vehicles.push({
                    mesh: car,
                    lights: [headlightL, headlightR],
                    lightsOn: false,
                    speed: 0,
                    steering: 0,
                    colorName: `Car ${idx+1}`
                });
            });
        }

        buildWorld();

        // --- 5. 플레이어 컨트롤 & 물리 및 애니메이션 상태 ---
        let gameStarted = false;
        let isFirstPerson = false;

        const keys = {};
        const playerState = {
            pos: new THREE.Vector3(-50, 0, -35),
            rotY: 0,
            velocityY: 0,
            isGrounded: true,
            isRunning: false,
            isSitting: false,
            inVehicle: null, // 현재 운전 중인 차량 객체
            animTime: 0
        };

        // 펀치 상태
        let punchAnim = { active: false, type: null, time: 0 };

        // 키 입력 처리
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            keys[k] = true;

            if(!gameStarted) return;

            // Shift 달리기/걷기 토글
            if(e.key === 'Shift') {
                playerState.isRunning = !playerState.isRunning;
            }

            // 시점 변환 (1키, 3키)
            if(e.key === '1') isFirstPerson = true;
            if(e.key === '3') isFirstPerson = false;

            // 점프 (Space)
            if(e.code === 'Space' && playerState.isGrounded && !playerState.inVehicle && !playerState.isSitting) {
                playerState.velocityY = 0.22; // 점프 력
                playerState.isGrounded = false;
            }

            // 상호작용 (F, Q, X)
            if(k === 'f') handleFInteraction();
            if(k === 'q') handleQInteraction();
            if(k === 'x') handleXVehicleToggle();

            // 차량 헤드라이트 / 브레이크
            if(playerState.inVehicle) {
                if(e.key === '5') {
                    const v = playerState.inVehicle;
                    v.lightsOn = !v.lightsOn;
                    v.lights.forEach(l => l.intensity = v.lightsOn ? 3 : 0);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // 마우스 클릭 (펀치 제어)
        let lastClickTimeLeft = 0;
        let lastClickTimeRight = 0;

        window.addEventListener('mousedown', (e) => {
            if(!gameStarted || playerState.inVehicle || playerState.isSitting) return;

            const now = performance.now();
            
            if(e.button === 0) { // 좌클릭 (스트레이트 / 라이트 훅)
                if(now - lastClickTimeLeft < 300) {
                    triggerPunch('rightHook');
                } else {
                    triggerPunch('straight');
                }
                lastClickTimeLeft = now;
            } else if(e.button === 2) { // 우클릭 (잽 / 레프트 바디)
                if(now - lastClickTimeRight < 300) {
                    triggerPunch('leftBody');
                } else {
                    triggerPunch('jab');
                }
                lastClickTimeRight = now;
            }
        });

        // 우클릭 컨텍스트 메뉴 차단
        window.addEventListener('contextmenu', e => e.preventDefault());

        function triggerPunch(type) {
            punchAnim.active = true;
            punchAnim.type = type;
            punchAnim.time = 0;
        }

        // 상호작용 기능 구함 (F, Q, X)
        function handleFInteraction() {
            interactables.forEach(item => {
                const dist = playerGroup.position.distanceTo(item.obj.getWorldPosition(new THREE.Vector3()));
                if(dist < 3.5) {
                    item.open = !item.open;
                    if(item.type === 'houseDoor') {
                        item.obj.rotation.y = item.open ? Math.PI / 2 : 0;
                    }
                }
            });
        }

        function handleQInteraction() {
            if(playerState.isSitting) {
                // 일어서기
                playerState.isSitting = false;
                playerGroup.position.y = 0;
                return;
            }

            sitables.forEach(item => {
                const dist = playerGroup.position.distanceTo(item.obj.getWorldPosition(new THREE.Vector3()));
                if(dist < 2.5) {
                    playerState.isSitting = true;
                    const pos = item.obj.getWorldPosition(new THREE.Vector3());
                    playerGroup.position.set(pos.x, pos.y + (item.type==='bed'? 0.4 : 0.2), pos.z);
                }
            });
        }

        function handleXVehicleToggle() {
            if(playerState.inVehicle) {
                // 내리기
                playerGroup.position.add(new THREE.Vector3(2, 0, 0));
                playerGroup.visible = true;
                playerState.inVehicle = null;
            } else {
                // 가장 가까운 차 타기
                vehicles.forEach(v => {
                    const dist = playerGroup.position.distanceTo(v.mesh.position);
                    if(dist < 4) {
                        playerState.inVehicle = v;
                        playerGroup.visible = false;
                    }
                });
            }
        }

        // UI 이벤트 : 시작 버튼
        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('customizer-ui').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            gameStarted = true;
        });

        // --- 6. 애니메이션 루프 & 물리 업데이트 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if(gameStarted) {
                if(playerState.inVehicle) {
                    updateVehiclePhysics();
                } else {
                    updatePlayerPhysics(delta);
                    updatePlayerAnimations(delta);
                }
                updateCamera();
                checkPrompts();
            }

            renderer.render(scene, camera);
        }

        // 플레이어 이동 및 점프 물리
        function updatePlayerPhysics(delta) {
            if(playerState.isSitting) return;

            const speed = playerState.isRunning ? 0.25 : 0.12;
            let moveVector = new THREE.Vector3(0, 0, 0);

            // WASD 이동 (점프 중에도 작동)
            if(keys['w']) moveVector.z += 1;
            if(keys['s']) moveVector.z -= 1;
            if(keys['a']) moveVector.x += 1;
            if(keys['d']) moveVector.x -= 1;

            if(moveVector.lengthSq() > 0) {
                moveVector.normalize();
                const moveAngle = Math.atan2(moveVector.x, moveVector.z);
                playerState.rotY = moveAngle;

                playerState.pos.x += Math.sin(moveAngle) * speed;
                playerState.pos.z += Math.cos(moveAngle) * speed;
            }

            // 중력 및 점프 디테일 물리
            playerState.velocityY -= 0.6 * delta; // 중력 가속도
            playerState.pos.y += playerState.velocityY;

            if(playerState.pos.y <= 0) {
                playerState.pos.y = 0;
                playerState.velocityY = 0;
                playerState.isGrounded = true;
            }

            playerGroup.position.copy(playerState.pos);
            playerGroup.rotation.y = playerState.rotY;
        }

        // 디테일한 포즈 및 애니메이션 (걷기/뛰기/점프 모션/펀치)
        function updatePlayerAnimations(delta) {
            playerState.animTime += delta * (playerState.isRunning ? 12 : 6);
            const t = playerState.animTime;

            const isMoving = keys['w'] || keys['s'] || keys['a'] || keys['d'];

            // 1. 점프 모션 디테일 (공중에 떠있을 때 몸 체어/다리 굽힘)
            if(!playerState.isGrounded) {
                bodyParts.legL.rotation.x = -0.5;
                bodyParts.legR.rotation.x = 0.8;
                bodyParts.armL.rotation.x = 1.2;
                bodyParts.armR.rotation.x = 1.2;
                bodyParts.torso.rotation.x = 0.2; // 약간 몸을 앞으로 숙임
            } 
            // 2. 이동 애니메이션 (걷기/뛰기)
            else if(isMoving && !playerState.isSitting) {
                bodyParts.torso.rotation.x = 0;
                bodyParts.legL.rotation.x = Math.sin(t) * 0.7;
                bodyParts.legR.rotation.x = -Math.sin(t) * 0.7;

                if(!punchAnim.active) {
                    bodyParts.armL.rotation.x = -Math.sin(t) * 0.7;
                    bodyParts.armR.rotation.x = Math.sin(t) * 0.7;
                }
            } 
            // 3. 정지 상태
            else if(!playerState.isSitting) {
                bodyParts.torso.rotation.x = 0;
                bodyParts.legL.rotation.x = 0;
                bodyParts.legR.rotation.x = 0;
                if(!punchAnim.active) {
                    bodyParts.armL.rotation.x = 0;
                    bodyParts.armR.rotation.x = 0;
                }
            }

            // 4. 펀치 동작 모션 (Jab, Straight, Right Hook, Left Body)
            if(punchAnim.active) {
                punchAnim.time += delta * 8;
                const pt = punchAnim.time;

                if(punchAnim.type === 'jab') { // 마우스 우클릭: 잽
                    bodyParts.armR.rotation.x = -Math.PI / 2;
                    bodyParts.armR.position.z = Math.sin(pt * Math.PI) * 0.3;
                } else if(punchAnim.type === 'straight') { // 마우스 좌클릭: 스트레이트
                    bodyParts.armL.rotation.x = -Math.PI / 2;
                    bodyParts.armL.position.z = Math.sin(pt * Math.PI) * 0.5;
                } else if(punchAnim.type === 'rightHook') { // 좌클릭 더블: 라이트 훅
                    bodyParts.armR.rotation.x = -Math.PI / 3;
                    bodyParts.armR.rotation.y = -Math.sin(pt * Math.PI) * 1.5;
                } else if(punchAnim.type === 'leftBody') { // 우클릭 더블: 레프트 바디
                    bodyParts.armL.rotation.x = -Math.PI / 4;
                    bodyParts.armL.rotation.z = Math.sin(pt * Math.PI) * 1.2;
                }

                if(pt >= 1.0) {
                    punchAnim.active = false;
                    bodyParts.armL.rotation.set(0,0,0);
                    bodyParts.armR.rotation.set(0,0,0);
                    bodyParts.armL.position.set(0.4, 0.2, 0);
                    bodyParts.armR.position.set(-0.4, 0.2, 0);
                }
            }
        }

        // 차량 물리 운전
        function updateVehiclePhysics() {
            const v = playerState.inVehicle;

            // 가속 / 후진
            if(keys['w']) v.speed = Math.min(v.speed + 0.01, 0.6);
            else if(keys['s']) v.speed = Math.max(v.speed - 0.008, -0.2);
            else v.speed *= 0.96; // 관성 감쇄

            // 브레이크 (4키)
            if(keys['4']) v.speed *= 0.8;

            // 핸들 조향
            if(keys['a']) v.steering = 0.03;
            else if(keys['d']) v.steering = -0.03;
            else v.steering = 0;

            v.mesh.rotation.y += v.steering * (v.speed / 0.6);
            v.mesh.translateZ(v.speed);

            // 카메라 연동을 위해 위치 동기화
            playerState.pos.copy(v.mesh.position);
        }

        // 카메라 1인칭 / 3인칭 조작
        function updateCamera() {
            if(isFirstPerson && !playerState.inVehicle) {
                // 1인칭 시점
                const headPos = new THREE.Vector3();
                bodyParts.head.getWorldPosition(headPos);
                camera.position.copy(headPos);
                camera.position.y += 0.1;
                
                const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0,1,0), playerState.rotY);
                camera.lookAt(headPos.clone().add(dir));
            } else {
                // 3인칭 시점 (플레이어/차량 뒤쪽 상단)
                const targetPos = playerState.inVehicle ? playerState.inVehicle.mesh.position : playerGroup.position;
                const rot = playerState.inVehicle ? playerState.inVehicle.mesh.rotation.y : playerState.rotY;

                const camOffset = new THREE.Vector3(0, 4, -8).applyAxisAngle(new THREE.Vector3(0, 1, 0), rot);
                camera.position.copy(targetPos).add(camOffset);
                camera.lookAt(targetPos.clone().add(new THREE.Vector3(0, 1.5, 0)));
            }
        }

        // 화면 근처 프롬프트 알림 UI
        function checkPrompts() {
            const prompt = document.getElementById('interaction-prompt');
            let textToShow = '';

            // 상호작용 문의 프롬프트
            interactables.forEach(item => {
                const dist = playerGroup.position.distanceTo(item.obj.getWorldPosition(new THREE.Vector3()));
                if(dist < 3) textToShow = item.text;
            });

            // 앉기 가구 프롬프트
            sitables.forEach(item => {
                const dist = playerGroup.position.distanceTo(item.obj.getWorldPosition(new THREE.Vector3()));
                if(dist < 2.5) textToShow = item.text;
            });

            // 차량 탑승 프롬프트
            vehicles.forEach(v => {
                const dist = playerGroup.position.distanceTo(v.mesh.position);
                if(dist < 4 && !playerState.inVehicle) textToShow = `차량 탑승 (X키) - ${v.colorName}`;
            });

            if(textToShow) {
                prompt.innerText = textToShow;
                prompt.style.display = 'block';
            } else {
                prompt.style.display = 'none';
            }
        }

        // 창 크기 변경 리사이즈 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 애니메이션 루프 시작
        animate();
    </script>
</body>
</html>
